name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mythology-dictionary:
    name: Mythology dictionary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mythology-dictionary
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall app.py db.py models.py import_export.py seed.py scripts tests

      - name: Check bundled dictionary
        run: python scripts/check_dictionary.py

      - name: Check quality summary
        run: python scripts/update_quality_summary.py --check

      - name: Run tests
        run: python -m pytest tests

  utility-starters:
    name: Utility starters
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - .tools/github-utility-starters/readme-assistant
          - .tools/github-utility-starters/downloads-organizer-cli
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall src tests

      - name: Run tests
        run: |
          export PYTHONPATH=src
          python -m unittest discover -s tests
