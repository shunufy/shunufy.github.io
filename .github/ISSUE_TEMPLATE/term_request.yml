name: Dictionary entry request
description: Suggest a mythology, folklore, or legendary-object entry.
title: "[Entry]: "
labels: ["data", "entry-request"]
body:
  - type: input
    id: term
    attributes:
      label: Term
      placeholder: Yggdrasil
    validations:
      required: true
  - type: input
    id: tradition
    attributes:
      label: Tradition or mythology
      placeholder: Norse mythology
  - type: textarea
    id: reason
    attributes:
      label: Why this belongs
      description: Explain the term's role, distinctive trait, or use case.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Add books, public-domain references, or stable web references when possible.

