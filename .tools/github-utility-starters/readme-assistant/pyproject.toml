[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-assistant"
version = "0.1.0"
description = "A tiny CLI that generates clean README files from project metadata."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Codex" }]
keywords = ["readme", "markdown", "cli", "generator"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
]

[project.scripts]
readme-assistant = "readme_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

